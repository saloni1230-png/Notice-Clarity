name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env: {POSTGRES_USER: notice, POSTGRES_PASSWORD: notice, POSTGRES_DB: notice_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notice -d notice_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NS_DATABASE_URL: postgresql+psycopg://notice:notice@localhost:5432/notice_test
      NS_REQUIRE_EMAIL_VERIFICATION: "false"
      NS_LOCAL_STORAGE: /tmp/notice-test-objects
      NS_SCANNER_HOST: ""
      NS_PUBLIC_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-dev.lock}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements.lock -r requirements-dev.lock && pip install --no-deps -e .
      - run: alembic upgrade head && alembic check
      - run: ruff check notice tests && pytest --cov=notice --cov-report=xml --junitxml=test-results.xml
      - run: python scripts/evaluate.py
      - run: python scripts/audit_dependencies.py
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: cp .env.example .env && docker compose config --quiet && docker build -t notice-clarity:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            test-results.xml
            coverage.xml
            test-results/
            playwright-report/
            eval-results.json
